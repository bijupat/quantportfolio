{% extends "base.html" %}
{% block title %}Sign in — QuantPortfolioAI{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Sign in</h4>
        {% if form.errors %}
          <div class="alert alert-danger">Incorrect username or password.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input type="text" name="username" class="form-control" id="id_username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
          <input type="hidden" name="next" value="{{ next }}">
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
