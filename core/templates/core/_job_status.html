<div class="alert {% if job.status == 'success' %}alert-success{% elif job.status == 'failed' %}alert-danger{% elif job.status == 'running' %}alert-info{% else %}alert-secondary{% endif %} py-2 px-3 mb-0"
     {% if not job.is_finished %}
       hx-get="{% url 'core:job_status' job.id %}"
       hx-trigger="load delay:2s"
       hx-swap="outerHTML"
     {% endif %}>
  <div class="d-flex justify-content-between align-items-center">
    <span>
      <strong>{{ job.command_name }}</strong> — {{ job.get_status_display }}
      {% if not job.is_finished %}
        <span class="spinner-border spinner-border-sm ms-2" role="status"></span>
      {% endif %}
    </span>
    <small class="text-muted">Job #{{ job.id }}</small>
  </div>

  {% if job.is_finished %}
    {% if job.output %}
      <pre class="mt-2 mb-0 small" style="max-height: 200px; overflow-y: auto;">{{ job.output }}</pre>
    {% endif %}
    {% if job.error %}
      <pre class="mt-2 mb-0 small text-danger" style="max-height: 200px; overflow-y: auto;">{{ job.error }}</pre>
    {% endif %}
  {% endif %}
</div>
